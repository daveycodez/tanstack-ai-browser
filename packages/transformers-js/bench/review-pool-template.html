<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Prompt API concurrent pool regression</title><style>body{font:15px system-ui;max-width:1100px;margin:30px auto;padding:20px}button{font:inherit;padding:10px}pre{white-space:pre-wrap;font:12px monospace}td{padding:8px;border-bottom:1px solid #ccc}</style></head><body><h1>Prompt API concurrent pool regression</h1><p>Six distinct cold threads through the standard TanStack API; native sessions/clones are observed only in this diagnostic page.</p><button id="run">Run native pool checks</button><button id="stop" disabled>Stop</button><p id="status">Ready.</p><table><tbody id="rows"></tbody></table><pre id="report"></pre><script type="module">
import {chat} from '@tanstack/ai';
import {promptApiText} from '@tanstack-ai-browser/prompt-api';
const unloadModel=()=>promptApiText('built-in').destroy();
const button=document.querySelector('#run'),stop=document.querySelector('#stop'),status=document.querySelector('#status'),out=document.querySelector('#report'),rows=document.querySelector('#rows');let cancel=()=>{};stop.onclick=()=>cancel();
button.onclick=async()=>{
 button.disabled=true;stop.disabled=false;rows.textContent='';const report={startedAt:new Date().toISOString(),configuredMax:4,threads:6,results:[],error:null};let restore=()=>{};
 try{
  if(!globalThis.LanguageModel)throw new Error('Prompt API unavailable');
  const nativeCreate=LanguageModel.create;restore=()=>{LanguageModel.create=nativeCreate;};
  for(const withCancel of [false,true]){
   unloadModel();status.textContent=withCancel?'Checking independent clone cancellation…':'Checking six cold concurrent requests…';
   const records=[];let openCreate,openPrompt,finishPrompts,fail;
   const createsReady=new Promise(resolve=>{openCreate=resolve}),promptsReady=new Promise(resolve=>{finishPrompts=resolve}),generationGate=new Promise(resolve=>{openPrompt=resolve}),failed=new Promise(resolve=>{fail=resolve});
   const controllers=Array.from({length:6},()=>new AbortController());cancel=()=>{for(const c of controllers)c.abort(new Error('Stopped'));openCreate();openPrompt();fail();};
   let completedCreates=0,startedPrompts=0;
   const track=(session,parent=null)=>{
    const record={id:records.length,parent:parent?.id??null,destroyed:false,prompted:false};records.push(record);
    const destroy=session.destroy.bind(session),clone=session.clone.bind(session),prompt=session.prompt.bind(session);
    session.destroy=()=>{record.destroyed=true;return destroy();};
    session.clone=async options=>track(await clone(options),record);
    session.prompt=async(...args)=>{record.prompted=true;startedPrompts++;if(startedPrompts===6)finishPrompts();await generationGate;return prompt(...args);};
    return session;
   };
   LanguageModel.create=async options=>{
    try{const session=track(await nativeCreate.call(LanguageModel,options));completedCreates++;if(completedCreates===6)openCreate();await createsReady;return session;}catch(error){openCreate();openPrompt();fail();throw error;}
   };
   const jobs=Array.from({length:6},(_,i)=>chat({adapter:promptApiText("built-in"),threadId:`review-native-${withCancel?'cancel':'success'}-${i}`,systemPrompts:['Return the requested JSON value.'],messages:[{role:'user',content:'Return a valid value matching the schema.'}],outputSchema:{type:'object',properties:{value:{type:'string',enum:['ok']}},required:['value'],additionalProperties:false},reasoning:'off',stream:false,abortController:controllers[i]}).catch(error=>{fail();throw error}));
   await Promise.race([promptsReady,failed]);
   const during={liveBases:records.filter(r=>r.parent===null&&!r.destroyed).length,liveClones:records.filter(r=>r.parent!==null&&!r.destroyed).length};
   if(withCancel)controllers[0].abort(new Error('cancel one clone'));
   openPrompt();const settled=await Promise.allSettled(jobs);
   const result={mode:withCancel?'cancel-one':'all-success',during,fulfilled:settled.filter(r=>r.status==='fulfilled').length,rejected:settled.filter(r=>r.status==='rejected').map(r=>String(r.reason)),liveBases:records.filter(r=>r.parent===null&&!r.destroyed).length,liveClones:records.filter(r=>r.parent!==null&&!r.destroyed).length,records:records.map(record=>({...record}))};
   result.pass=result.liveBases===4&&result.liveClones===0&&during.liveClones===6&&result.fulfilled===(withCancel?5:6)&&result.rejected.length===(withCancel?1:0);
   unloadModel();result.afterCleanupAlive=records.filter(r=>!r.destroyed).length;result.pass&&=result.afterCleanupAlive===0;report.results.push(result);
   const tr=document.createElement('tr');for(const value of [result.mode,result.pass?'PASS':'FAIL',JSON.stringify({...result,records:undefined})]){const td=document.createElement('td');td.textContent=value;tr.append(td)}rows.append(tr);out.textContent=JSON.stringify(report,null,2);
  }
  status.textContent=`Complete: ${report.results.filter(r=>r.pass).length}/${report.results.length} native checks passed.`;
 }catch(error){report.error=String(error);status.textContent='Failed: '+error.message;}finally{unloadModel();restore();report.finishedAt=new Date().toISOString();out.textContent=JSON.stringify(report,null,2);button.disabled=false;stop.disabled=true;}
};
</script></body></html>
