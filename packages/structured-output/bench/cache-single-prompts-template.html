<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single prompt latency</title><style>body{font:15px system-ui;color:#243346;background:#f6f8fa;max-width:1100px;margin:30px auto;padding:20px}button,select{font:inherit;padding:10px;margin:6px}td,th{padding:8px;text-align:left;border-bottom:1px solid #ccc}pre{font:11px monospace;white-space:pre-wrap}</style></head><body><h1>Single prompt latency</h1><p>Independent plain-text and structured requests with normal TanStack options. Model-default settings; thinking off. No saved-game changes.</p><select id="runtime"><option value="webgl">WebGL LFM3 GGUF</option><option value="tjs">Transformers.js LFM2.5 350M</option><option value="prompt">Prompt API</option><option value="apfel">Apfel</option><option value="wllama">Wllama LFM2.5 350M</option></select><select id="profile"><option value="baseline">Before</option><option value="current">After</option></select><select id="cachePolicy"><option value="automatic">Automatic</option><option value="none">None</option></select><button id="run">Run benchmark</button><button id="stop" disabled>Stop</button><p id="status">Ready.</p><table><thead><tr><th>Kind</th><th>Case</th><th>Correct</th><th>Total ms</th><th>Input</th><th>Cached</th><th>Prompt ms</th></tr></thead><tbody id="rows"></tbody></table><details><summary>Full report</summary><pre id="report"></pre></details><script type="module">
import {chat} from '@tanstack/ai';
const root=__ROOT_URL__,button=document.querySelector('#run'),stop=document.querySelector('#stop'),status=document.querySelector('#status'),rows=document.querySelector('#rows'),out=document.querySelector('#report');let controller;stop.onclick=()=>controller?.abort();
button.onclick=async()=>{
 button.disabled=true;stop.disabled=false;rows.textContent='';controller=new AbortController();const runtime=document.querySelector('#runtime').value,profile=document.querySelector('#profile').value,cachePolicy=document.querySelector('#cachePolicy').value,report={runtime,profile,startedAt:new Date().toISOString(),settings:{sampling:'model defaults',reasoning:'off',outputLimit:'model default',context:'model default',promptCache:cachePolicy},results:[],error:null};let unload=()=>{};
 try{
  let adapter;
  if(['webgl','tjs','wllama'].includes(runtime)){
   const pkg=runtime==='webgl'?'webgl':runtime==='tjs'?'transformers-js':'wllama',frozen=profile==='baseline'&&runtime!=='wllama',path=`packages/${pkg}/${frozen?'.cache-qa-baseline':'src'}/index.ts`,mod=await import(/* @vite-ignore */root+path),model=runtime==='webgl'?'LiquidAI/LFM3-1.7B-GGUF':runtime==='tjs'?'LiquidAI/LFM2.5-350M-ONNX':'LiquidAI/LFM2.5-350M-GGUF';report.model=model;status.textContent='Loading '+model+'…';unload=mod.unloadModel;await mod.loadModel(model);adapter=runtime==='webgl'?mod.webglText(model):runtime==='tjs'?mod.transformersJsText(model):mod.wllamaText(model);
  }else if(runtime==='prompt'){const mod=await import(/* @vite-ignore */root+'packages/prompt-api/src/index.ts');mod.destroyPromptApiSessions();unload=mod.destroyPromptApiSessions;adapter=mod.promptApiText();report.model=adapter.model;}else{const mod=await import(/* @vite-ignore */root+'packages/apfel/src/index.ts');adapter=mod.apfelText('apple-foundationmodel');report.model=adapter.model;}
  const schema={type:'object',properties:{city:{type:'string',enum:['Paris','Tokyo','Rome','Madrid']}},required:['city'],additionalProperties:false};
  for(const kind of ['text','structured'])for(const [country,expected] of [['France','Paris'],['Japan','Tokyo'],['Italy','Rome'],['Spain','Madrid']]){
   controller.signal.throwIfAborted();status.textContent=`Running ${kind}: ${country}`;const input={system:'Answer the user concisely.',messages:[{role:'user',content:`What is the capital of ${country}? ${kind==='text'?'Answer with the city name only.':'Return the city in the requested JSON object.'}`}],...(kind==='structured'&&{schema})};let usage,raw,data,error;const wrapped=Object.create(adapter);
   wrapped.structuredOutput=async options=>{const result=await adapter.structuredOutput(options);usage=result.usage;raw=result.rawText;return result;};
   const began=performance.now();try{data=await chat({adapter:wrapped,threadId:'single-prompt-'+kind,systemPrompts:[input.system],messages:input.messages,...(input.schema&&{outputSchema:input.schema}),reasoning:'off',stream:false,promptCache:cachePolicy==='none'?'none':undefined,abortController:controller});if(kind==='text'){usage=data.chunks?.findLast(e=>e.type==='RUN_FINISHED')?.usage;raw=data.text;}}catch(e){error=String(e)}
   const answer=kind==='structured'?data?.city:raw?.trim().replace(/[.!]+$/,'');const result={caseId:kind+'-'+country,group:kind,input,expected,correct:answer===expected&&!error,data,raw,error,usage,totalMs:performance.now()-began};report.results.push(result);const tr=document.createElement('tr');for(const value of [kind,country,result.correct?'PASS':'MISS',result.totalMs.toFixed(1),usage?.promptTokens??'—',usage?.promptTokensDetails?.cachedTokens??(runtime==='apfel'?'not reported':0),usage?.providerUsageDetails?.promptMs?.toFixed(1)??'—']){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}rows.append(tr);out.textContent=JSON.stringify(report,null,2);
  }
  status.textContent=`Complete: ${report.results.filter(r=>r.correct).length}/${report.results.length} correct.`;
 }catch(e){report.error=String(e);status.textContent='Failed: '+e.message}finally{await unload();report.finishedAt=new Date().toISOString();out.textContent=JSON.stringify(report,null,2);button.disabled=false;stop.disabled=true;}
};
</script></body></html>
