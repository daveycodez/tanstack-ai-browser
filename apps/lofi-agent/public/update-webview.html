<!doctype html>
<!--
  What the Android app shows where the device's web view is older than the site's build can
  run on (capacitor.config.ts: android.minWebViewVersion, server.errorPath). Written for
  those web views: plain HTML, no modern CSS or JavaScript.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lofi-agent</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: sans-serif; font-size: 16px; line-height: 1.5; color: #18181b; background: #f5f5f5; }
      .page { max-width: 28em; margin: 0 auto; padding: 4em 1.5em; }
      h1 { font-size: 1.4em; margin: 0 0 0.75em; }
      p { margin: 0 0 1em; }
      a.button { display: inline-block; margin-top: 0.5em; padding: 0.7em 1.2em; border-radius: 0.6em; background: #0a84ff; color: #ffffff; text-decoration: none; font-weight: bold; }
      .small { color: #52525b; font-size: 0.9em; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>lofi-agent couldn't start</h1>
      <p>
        On Android this means the system web view is too old: lofi-agent needs
        <b>Android System WebView 111</b> or later.
      </p>
      <p>Update it in the Play Store, then open lofi-agent again.</p>
      <p><a class="button" href="https://play.google.com/store/apps/details?id=com.google.android.webview">Update Android System WebView</a></p>
      <p class="small" id="version"></p>
    </div>
    <script>
      // (For old web views: no arrow functions, const or optional chaining.)
      var found = /Chrome\/(\d+)/.exec(navigator.userAgent);
      if (found) document.getElementById("version").innerHTML = "This device has version " + found[1] + ".";
    </script>
  </body>
</html>
