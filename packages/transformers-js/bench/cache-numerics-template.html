<!doctype html><html lang="en"><head><meta charset="utf-8"><title>WebGL prefix restoration correctness</title><style>body{font:15px system-ui;max-width:1050px;margin:30px auto;padding:20px;background:#f6f8fa;color:#243346}button,select{padding:10px;font:inherit;margin:6px}pre{font:12px/1.5 monospace;white-space:pre-wrap}</style></head><body><h1>WebGL prefix restoration correctness</h1><p>Same model and input: cold GPU computation versus restored prefix. No generated answer or saved-game changes.</p><select id="model"><option value="LiquidAI/LFM3-1.7B-GGUF">LFM3 GGUF · convolution + sliding attention</option><option value="unsloth/Qwen3.5-2B-GGUF">Qwen3.5 GGUF · recurrent state</option></select><button id="run">Run numerical check</button><p id="status" role="status">Ready.</p><pre id="result"></pre><details><summary>Log</summary><pre id="logs"></pre></details><script type="module">
let worker;const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result'),logs=document.querySelector('#logs');
button.onclick=()=>{worker?.terminate();button.disabled=true;result.textContent='';logs.textContent='';status.textContent='Loading and checking GPU state…';worker=new Worker(new URL(__WORKER_URL__,import.meta.url),{type:'module'});worker.onmessage=({data})=>{if(data.type==='log')logs.textContent+=data.text+'\n';if(data.type==='result')result.textContent=JSON.stringify(data.value,null,2);if(data.type==='done'){status.textContent='Complete.';button.disabled=false;worker.terminate();}if(data.type==='error'){status.textContent='Failed: '+data.message;button.disabled=false;worker.terminate();}};worker.onerror=event=>{status.textContent='Failed: '+event.message;button.disabled=false;worker.terminate();};worker.postMessage({model:document.querySelector('#model').value,mode:'prefix',batch:0,length:1800,followLength:0,turns:2,target:0,reply:1,thinking:false,tune:'',variants:'default',rounds:1,cdp:false,detail:false});};
</script></body></html>
