<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adapter tool and native cache conformance</title><style>body{font:15px system-ui;color:#243346;background:#f6f8fa;max-width:1050px;margin:30px auto;padding:20px}select,button{font:inherit;padding:10px;margin:6px}pre{font:12px/1.5 monospace;white-space:pre-wrap}td{padding:10px;border-bottom:1px solid #ccc}</style></head><body><h1>Adapter tool and native cache conformance</h1><p>Model-default settings; local synthetic tool results; no saved-game changes.</p><select id="runtime"><option value="webgl">WebGL LFM3 GGUF</option><option value="tjs">Transformers.js LFM2.5 350M</option><option value="prompt">Prompt API</option><option value="apfel">Apfel</option><option value="wllama">Wllama LFM2.5 350M · cache control</option></select><select id="profile"><option value="current">After (WebGL / Transformers)</option><option value="baseline">Before (WebGL / Transformers)</option></select><button id="run">Run checks</button><p id="status" role="status">Ready.</p><table><tbody id="rows"></tbody></table><details><summary>Full report</summary><pre id="report"></pre></details><script type="module">
import {chat} from '@tanstack/ai';
const root=__ROOT_URL__,button=document.querySelector('#run'),status=document.querySelector('#status'),rows=document.querySelector('#rows'),out=document.querySelector('#report');
const logger={request:()=>{},errors:()=>{},provider:()=>{},warn:()=>{}};
button.onclick=async()=>{
 button.disabled=true;rows.textContent='';let unload=()=>{};
 const runtime=document.querySelector('#runtime').value,profile=document.querySelector('#profile').value,result={runtime,profile,startedAt:new Date().toISOString(),settings:{sampling:'model defaults',outputLimit:'model default',context:'model default',reasoning:'off'},checks:[],stages:[],events:[],error:null};
 const row=(name,pass,details)=>{result.checks.push({name,pass,details});const tr=document.createElement('tr');for(const t of [name,pass?'PASS':'MISS',typeof details==='string'?details:JSON.stringify(details)]){const td=document.createElement('td');td.textContent=t;tr.append(td)}rows.append(tr);out.textContent=JSON.stringify(result,null,2)};
 try{
  let adapter,model;
  if(runtime==='webgl'||runtime==='tjs'||runtime==='wllama'){
   const pkg=runtime==='webgl'?'webgl':runtime==='tjs'?'transformers-js':'wllama',path=profile==='baseline'&&runtime!=='wllama'?`packages/${pkg}/.cache-qa-baseline/index.ts`:`packages/${pkg}/src/index.ts`,mod=await import(/* @vite-ignore */root+path);
   model=runtime==='webgl'?'LiquidAI/LFM3-1.7B-GGUF':runtime==='tjs'?'LiquidAI/LFM2.5-350M-ONNX':'LiquidAI/LFM2.5-350M-GGUF';status.textContent='Loading '+model+'…';unload=mod.unloadModel;await mod.loadModel(model);
   adapter=runtime==='webgl'?mod.webglText(model):runtime==='tjs'?mod.transformersJsText(model):mod.wllamaText(model);
   if(runtime==='wllama'){result.backend='runtime default';result.webgpuAvailable=await mod.runsOnWebGpu();}
  }else if(runtime==='prompt'){const mod=await import(/* @vite-ignore */root+'packages/prompt-api/src/index.ts');adapter=mod.promptApiText({nativeTools:false});model=adapter.model;unload=mod.destroyPromptApiSessions;}else{const mod=await import(/* @vite-ignore */root+'packages/apfel/src/index.ts');adapter=mod.apfelText('apple-foundationmodel');model=adapter.model;}
  result.model=model;
  if(runtime==='wllama'){
   const system='Return the requested value as JSON. Follow the user request.';
   for(const [label,policy,value] of [['uncached','none','alpha'],['cached','short','alpha'],['changed-schema','long','gamma'],['disabled-after-warm','none','gamma']]){
    status.textContent='Checking '+label;let usage;const wrapped=Object.create(adapter);wrapped.structuredOutput=async options=>{const answer=await adapter.structuredOutput(options);usage=answer.usage;return answer;};
    const schema={type:'object',properties:{value:{type:'string',enum:[value]}},required:['value'],additionalProperties:false};
    const answer=await chat({adapter:wrapped,threadId:'native-cache-control',systemPrompts:[system],messages:[{role:'user',content:'Return a valid object matching the supplied response schema.'}],outputSchema:schema,stream:false,reasoning:'off',promptCache:policy});
    row(label,answer.value===value,{answer,usage,promptCache:policy});
   }
  }else{
   {const method=typeof adapter.completeStructured==='function'?'completeStructured':'structuredOutput';const complete=adapter[method].bind(adapter);adapter[method]=async(...args)=>{const began=performance.now();const answer=await complete(...args);result.stages.push({schema:args[0].outputSchema,usage:answer.usage,ms:performance.now()-began});return answer;};}
   const tool={name:'lookup_case',description:'Look up the case identified by caseId. If a previous result supplies nextCaseId, use that for the next lookup.',inputSchema:{type:'object',properties:{caseId:{type:'string',enum:['case42','case17']}},required:['caseId'],additionalProperties:false}};
   const user={role:'user',content:'Use lookup_case with caseId case42. When a lookup result supplies nextCaseId, call lookup_case again using exactly that nextCaseId.'};
   const base={logger,threadId:'generic-tool-cache',model,systemPrompts:['Use the requested tool with its exact arguments. Treat tool results as authoritative data.'],tools:[tool],toolChoice:'required',reasoning:{level:'off'}};
   status.textContent='Checking constrained routing and arguments…';
   const first=[];for await(const event of adapter.chatStream({...base,messages:[user]}))first.push(event);
   result.events.push(first);const a=first.find(event=>event.type==='TOOL_CALL_END');row('Required tool and argument schema',a?.toolCallName==='lookup_case'&&a?.input?.caseId==='case42',{call:a,error:first.find(e=>e.type==='RUN_ERROR')});
   if(a){
    status.textContent='Checking authoritative tool-result context…';
    const history=[user,{role:'assistant',content:'',toolCalls:[{id:a.toolCallId,type:'function',function:{name:'lookup_case',arguments:JSON.stringify(a.input)}}]},{role:'tool',toolCallId:a.toolCallId,content:'{"nextCaseId":"case17"}'}];
    const second=[];for await(const event of adapter.chatStream({...base,toolChoice:{type:'tool',name:'lookup_case'},messages:history}))second.push(event);
    result.events.push(second);const b=second.find(event=>event.type==='TOOL_CALL_END');row('Tool result survives guided request formatting',b?.input?.caseId==='case17',{call:b,error:second.find(e=>e.type==='RUN_ERROR')});
   }
  }
  status.textContent=`Complete: ${result.checks.filter(c=>c.pass).length}/${result.checks.length} checks passed.`;
 }catch(error){result.error=String(error);status.textContent='Failed: '+error.message;}finally{unload();result.finishedAt=new Date().toISOString();out.textContent=JSON.stringify(result,null,2);button.disabled=false;}
};
</script></body></html>
