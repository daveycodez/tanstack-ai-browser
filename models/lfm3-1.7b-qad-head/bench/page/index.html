<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><body style="font:16px system-ui;padding:16px"><pre id=o>starting…</pre><script type=module>
const out = document.getElementById("o")
const params = new URLSearchParams(location.search)
const relay = params.get("relay")
const send = (obj) => { out.textContent += "\n" + JSON.stringify(obj); if (relay) fetch(relay, { method: "POST", mode: "no-cors", body: JSON.stringify(obj) }).catch(() => {}) }
const url = params.get("model") ?? "https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/8ed288026e23958ad9dfa92d53ed773a8eee7125/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"

  // The largest file in this origin's OPFS: the downloaded GGUF.
  const files = []
  const walk = async (dir, path) => { for await (const [name, h] of dir.entries()) { if (h.kind === "directory") await walk(h, path + name + "/"); else files.push({ h, path: path + name }) } }
  await walk(await navigator.storage.getDirectory(), "")

  const want = params.get("storage")
  const big = sized.filter((f) => want === "1" || f.path.includes(want)).sort((a, b) => b.size - a.size)[0]
  if (!big) send({ storage: "no file" })
  else {
    const mb = big.size / 1e6
    let t = performance.now(); const buf = await (await big.h.getFile()).arrayBuffer(); const wholeMs = performance.now() - t
    t = performance.now(); const reader = (await big.h.getFile()).stream().getReader(); let n = 0; for (;;) { const { done, value } = await reader.read(); if (done) break; n += value.byteLength } const streamMs = performance.now() - t
    // Blob slices of 4 MB and 64 MB, as a reader with bounded chunks would do.
    const sliceRead = async (chunk) => { const f = await big.h.getFile(); const t0 = performance.now(); for (let o = 0; o < f.size; o += chunk) await f.slice(o, o + chunk).arrayBuffer(); return performance.now() - t0 }
    const s4 = await sliceRead(4e6), s64 = await sliceRead(64e6)
    send({ storage: big.path.slice(-60), MB: Math.round(mb), wholeMBs: Math.round(mb / wholeMs * 1000), streamMBs: Math.round(mb / streamMs * 1000), slice4MBs: Math.round(mb / s4 * 1000), slice64MBs: Math.round(mb / s64 * 1000), check: buf.byteLength === big.size && n === big.size })
  }

      if (/buffer size/.test(s)) bufs.push(s.replace(/^.*?(\w+_?\w* *(model|KV|compute|RS|output) buffer size)/, "$1").slice(0, 100))
      if (s.includes("load_tensors: loading model tensors")) marks.tensorsStart = at()
      if (s.includes("constructing llama_context")) marks.tensorsEnd = at()
      if (/async file read|mmap|Multithread|Loading model|fs\.|alloc|compat|JSPI|WebGPU/i.test(s) && notes.length < 12) notes.push(`${at()}ms ${s.slice(0, 110)}`) },
    log: (...a) => { const s = a.map(String).join(" "); if (/buffer size/.test(s)) bufs.push(s.slice(-100)); if (notes.length < 12 && !/llama_model_loader: - kv/.test(s)) notes.push(`${at()}ms log ${s.slice(0, 110)}`) }, info() {}, warn: (...a) => notes.push(`${at()}ms warn ${a.map(String).join(" ").slice(0, 140)}`), error: (...a) => notes.push(`${at()}ms error ${a.map(String).join(" ").slice(0, 140)}`) }

  } catch (e) { send({ run, error: String(e), notes }) }
}
send({ done: true })
</script>
