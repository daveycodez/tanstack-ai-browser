<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple tool-call latency</title><style>body{font:15px system-ui;max-width:1100px;margin:30px auto;padding:20px;color:#243346;background:#f6f8fa}button,select{font:inherit;padding:10px;margin:6px}td,th{padding:8px;text-align:left;border-bottom:1px solid #ccc}pre{font:11px monospace;white-space:pre-wrap}</style></head><body><h1>Simple tool-call latency</h1><p>One natural-language request per call; automatic, required, and named tool choice. Model defaults, thinking off. No saved-game changes.</p><label>Runtime<select id="runtime"><option value="webgl">WebGL LFM3 GGUF</option><option value="tjs">Transformers.js LFM2.5 350M</option></select></label><label>Profile<select id="profile"><option value="baseline">Before</option><option value="current">After</option></select></label><button id="run">Run benchmark</button><p id="status">Ready.</p><table><thead><tr><th>Choice</th><th>Case</th><th>Correct</th><th>Total ms</th><th>Input</th><th>Cached</th></tr></thead><tbody id="rows"></tbody></table><details><summary>Full report</summary><pre id="report"></pre></details><script type="module">
const root=__ROOT_URL__,button=document.querySelector('#run'),status=document.querySelector('#status'),rows=document.querySelector('#rows'),out=document.querySelector('#report');
button.onclick=async()=>{
 button.disabled=true; rows.textContent=''; const runtime=document.querySelector('#runtime').value,profile=document.querySelector('#profile').value,report={runtime,profile,startedAt:new Date().toISOString(),settings:{sampling:'model defaults',reasoning:'off',outputLimit:'model default',context:'model default'},results:[],error:null}; let unload=()=>{};
 try{
  const pkg=runtime==='webgl'?'webgl':'transformers-js',path=profile==='baseline'?`packages/${pkg}/.cache-qa-baseline/index.ts`:`packages/${pkg}/src/index.ts`,mod=await import(/* @vite-ignore */root+path),model=runtime==='webgl'?'LiquidAI/LFM3-1.7B-GGUF':'LiquidAI/LFM2.5-350M-ONNX';
  report.model=model;unload=mod.unloadModel;status.textContent='Loading '+model+'…';await mod.loadModel(model);const adapter=runtime==='webgl'?mod.webglText(model):mod.transformersJsText(model);
  const tool={name:'get_weather',description:'Get current weather for the requested city.',inputSchema:{type:'object',properties:{city:{type:'string',enum:['Paris','Tokyo','London','Berlin']}},required:['city'],additionalProperties:false}},system='Use get_weather when the user asks for current weather. Use the exact city requested.';
  const logger={request:()=>{},errors:()=>{},provider:()=>{},warn:()=>{}};
  for(const choice of ['auto','required','named'])for(const city of ['Paris','Tokyo','London','Berlin']){
   status.textContent=`Running ${choice}: ${city}`;const toolChoice=choice==='named'?{type:'tool',name:'get_weather'}:choice,input={system,messages:[{role:'user',content:`What's the current weather in ${city}?`}],tool,toolChoice};let events=[],error;const start=performance.now();
   try{for await(const e of adapter.chatStream({logger,threadId:'simple-tools-'+choice,systemPrompts:[system],messages:input.messages,tools:[tool],toolChoice,reasoning:{level:'off'}}))events.push(e)}catch(e){error=String(e)}
   const calls=events.filter(e=>e.type==='TOOL_CALL_END'),failed=events.find(e=>e.type==='RUN_ERROR'),usage=events.findLast(e=>e.type==='RUN_FINISHED')?.usage,totalMs=performance.now()-start,result={choice,city,input,correct:calls.length===1&&calls[0].toolCallName==='get_weather'&&calls[0].input?.city===city&&!failed&&!error,totalMs,usage,events,error};report.results.push(result);
   const tr=document.createElement('tr');for(const value of [choice,city,result.correct?'PASS':'MISS',totalMs.toFixed(1),usage?.promptTokens??'—',usage?.promptTokensDetails?.cachedTokens??0]){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}rows.append(tr);out.textContent=JSON.stringify(report,null,2);
  }
  status.textContent=`Complete: ${report.results.filter(r=>r.correct).length}/${report.results.length} correct.`;
 }catch(e){report.error=String(e);status.textContent='Failed: '+e.message}finally{unload();report.finishedAt=new Date().toISOString();out.textContent=JSON.stringify(report,null,2);button.disabled=false;}
};
</script></body></html>
