<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><body style="font:16px system-ui;padding:16px"><pre id=o>qopfs…</pre><script type=module>
// Lists files in this origin's OPFS with size, first 4 bytes and (for metadata files) their JSON.
const out = document.getElementById("o")
const send = (obj) => { out.textContent += "\n" + JSON.stringify(obj); return fetch("http://localhost:3999/", { method: "POST", mode: "no-cors", body: JSON.stringify(obj) }).catch(() => {}) }
const files = []
const walk = async (dir, path) => { for await (const [name, h] of dir.entries()) { if (h.kind === "directory") await walk(h, path + name + "/"); else files.push({ h, path: path + name }) } }
await walk(await navigator.storage.getDirectory(), "")
const rows = []
for (const f of files) {
  try {
    const file = await f.h.getFile()
    const head = new Uint8Array(await file.slice(0, 4).arrayBuffer())
    const r = { path: f.path.slice(-50), size: file.size, head: String.fromCharCode(...head).replace(/[^ -~]/g, "?") }
    if (file.size < 4000) r.text = (await file.text()).slice(0, 300)
    rows.push(r)
  } catch (e) { rows.push({ path: f.path.slice(-50), err: String(e) }) }
}
for (const r of rows) await send({ qopfs: r })
await send({ done: true })
</script>
